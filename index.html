function updatePlayer(dt) {

  if (keys.KeyW || keys.ArrowUp) mz += 1; if (keys.KeyS || keys.ArrowDown) mz -= 1;
  if (keys.KeyD) mx += 1; if (keys.KeyA) mx -= 1;
  if (keys.ArrowLeft || keys.KeyQ) yaw += 2.4 * dt; if (keys.ArrowRight || keys.KeyE) yaw -= 2.4 * dt;
  mx += joy.x; mz -= joy.y;
  const len = Math.hypot(mx, mz); if (len > 1) { mx /= len; mz /= len; }
  const wantSprint = (keys.ShiftLeft || keys.ShiftRight || dashHeld) && len > 0.1;
  let sprint = false;
  if (state === 'chase' || state === 'blackout') {
    if (wantSprint && !tired) { sprint = true; stamina -= 20 * dt; if (stamina <= 0) { stamina = 0; tired = true; } }

  collide(player, 0.35);
  const moving = len > 0.1;
  const bob = moving ? Math.sin(time * (sprint ? 14 : 10)) * (sprint ? 0.06 : 0.035) : 0;
  camera.position.set(player.x, EYE_H + bob, player.z);

  if (tx === null) return null;
  const dx = tx - player.x, dz = tz - player.z;
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
  return Math.atan2(dx * rx + dz * rz, dx * fx + dz * fz);

  const pf = bfs([freeCellOf(player)]);

function updateExplore(dt) {
  if (Math.random() < dt * 0.8) sfx.bubble();
  for (const c of chars) {
    c.callT = (c.callT ?? rand(2, 6)) - dt;
    if (c.callT <= 0) { c.callT = rand(5, 9); if (!c.found) voiceAt(c, false, 20); else if (Math.random() < 0.3) voiceAt(c, false, 14); }
  }
  const fwd = new V3(); camera.getWorldDirection(fwd);
  for (const c of chars) {
    if (c.found) continue;
    const to = new V3(c.pos.x - camera.position.x, 0.6 * 1 - camera.position.y, c.pos.z - camera.position.z);
    const dh = Math.hypot(to.x, to.z);
    if (dh > 3.4) continue;
    to.normalize();
    if ((dh < 1.6 || fwd.dot(to) > 0.55) && los(player.x, player.z, c.pos.x, c.pos.z)) found(c);
  }
  const g = $('guide');
  if (time < hintUntil && hintChar && !hintChar.found) {
    const a = guideDir(hintField); g.style.display = 'flex'; g.className = 'hint';
    $('arrIcon').style.transform = `rotate(${a ?? 0}rad)`; $('guideTxt').textContent = hintChar.def.name;
  } else g.style.display = 'none';
  if (foundCount === 6 && time - allFoundAt > 3.6) startBlackout();
}

  if (foundCount === 6) { allFoundAt = time; setTimeout(() => { msg('ぜんいん みーつけた! 🎉', 2.4); sfx.all(); }, 900); }

}

// ---------- 照明 ----------
const signDark = new THREE.Color(0x1a1a1a), white = new THREE.Color(0xffffff);
function setLights(level) {
  hemi.intensity = 0.95 * level; ambL.intensity = 0.35 * level;
  ROOM_LIGHTS.forEach(l => l.intensity = l.userData.base * level);
  waterMats.forEach(w => w.m.emissiveIntensity = w.base * Math.max(level, 0.12));
  caustic.visible = level > 0.5;
}
function setDarkWorld() {
  scene.background.set(0x05070d); scene.fog.color.set(0x05070d); scene.fog.near = 6; scene.fog.far = 48;
  hemi.intensity = 0.38; hemi.color.set(0x6a7fb0); hemi.groundColor.set(0x301018); ambL.intensity = 0.12;
  ROOM_LIGHTS.forEach((l, i) => { l.color.set(0xff2a1a); l.userData.dark = i % 2 === 0 ? 9 : 5; l.intensity = l.userData.dark; });
  waterMats.forEach(w => w.m.emissiveIntensity = w.keep ?? w.base * 0.3);
  caustic.visible = false;
  signMats.forEach(m => m.color.set(0x555555));
  outlineMats.forEach(m => m.color.set(0x5a0816));
  flash.intensity = 38;
  $('top').style.background = 'rgba(40,0,8,.75)';
  EXITS.forEach(e => { if (e.id === 'S') e.glowMat.color.set(0x5a6a80); });
}
function chooseExit() {
  const pf = bfs([freeCellOf(player)]);
  let best = EXITS[0], bd = -1;
  for (const e of EXITS) { const d = Math.min(...e.inner.map(c => pf[gi(...c)] < 0 ? 1e9 : pf[gi(...c)])); if (d < 1e9 && d > bd) { bd = d; best = e; } }
  return best;
}
function openExit(e) {
  chosenExit = e; e.cells.forEach(([x, z]) => grid[gi(x, z)] = OPEN);
  e.sign.visible = true; e.light.intensity = 30; e.glowMat.color.set(0xcfffe0); e.opening = 0;
  EXITS.forEach(o => { if (o !== e) { o.shutter.visible = true; o.closing = 0; } });
  exitField = bfs(e.cells);
}
function closeExits() { EXITS.forEach(e => { e.cells.forEach(([x, z]) => grid[gi(x, z)] = DOOR); }); }

// ---------- フェーズ2：ていでん ----------
function startBlackout() {
  state = 'blackout'; boT = 0; boFlags = {};
  checkpoint.pos.copy(player); checkpoint.yaw = yaw;
  $('guide').style.display = 'none';
}
function computeSpawns() {
  const pf = bfs([freeCellOf(player)]);
  const far = []; for (let th = 15; th >= 0 && !far.length; th -= 5) for (let z = 0; z < GH; z++) for (let x = 0; x < GW; x++) if (pf[gi(x, z)] >= th) far.push([x, z]);
  const used = [];
  return chars.map(c => {
    const d = pf[gi(...c.def.spot)];
    if (c === lastFound || d >= 13) { used.push(c.def.spot); return c.def.spot; }
    let pick = far[0], bs = -1;
    for (let k = 0; k < 40; k++) { const cand = far[(Math.random() * far.length) | 0]; const s = Math.min(...used.map(u => Math.hypot(u[0] - cand[0], u[1] - cand[1])), 99); if (s > bs) { bs = s; pick = cand; } }
    used.push(pick); return pick;
  });
}
function placeEnemies() {
  chars.forEach((c, i) => {
    const [x, z] = checkpoint.spawns[i];
    if (c !== lastFound) c.root.position.set(cw(x), 0, cw(z));
    else c.root.position.copy(c.home);
    c.root.rotation.y = Math.atan2(player.x - c.pos.x, player.z - c.pos.z) + c.forward;
    c.active = false; c.moving = false;
    c.activateAt = c === lastFound ? 4.5 : 1 + i * 1.3;
    c.speed = [2.8, 2.95, 3.1, 3.2, 3.35, 3.5][i];
    if (c === lastFound) c.speed = 2.8;
  });
}
function updateBlackout(dt) {
  boT += dt;
  if (boT < 1.7) {
    if (!boFlags.fl || boT > boFlags.fl) { boFlags.fl = boT + rand(0.05, 0.18); const on = Math.random() < 0.45; setLights(on ? 1 : 0.1); if (!on) sfx.buzz(); }
    if (!boFlags.m0) { boFlags.m0 = 1; stopMusic(true); msg('…あれ?', 1.4); }
  } else if (!boFlags.dark) {
    boFlags.dark = 1; setLights(0); setDarkWorld(); sfx.powerDown();
    chars.forEach(c => { c.setDark(true); c.hud.classList.add('dark'); });
    if (lastFound) setTimeout(() => voice(lastFound.def.key, { creepy: true, vol: 1.4 }), 1300);
    checkpoint.spawns = computeSpawns(); placeEnemies();
    setTimeout(() => sfx.sting(), 500);
    msg('みんなの ようすが おかしい…', 2.2, true);
  } else if (boT > 4 && !boFlags.go) {
    boFlags.go = 1; openExit(chooseExit());
    drone = pad([55, 55.6, 82.4, 110.3], 'sawtooth', 0.06, 220); setMusic('scary');
    startChase();
  }
}
function startChase() {
  state = 'chase'; chaseT = 0; stamina = 100; tired = false; heartT = 0;
  lives = MAX_LIVES; invulnUntil = 0; drawLives(); $('lives').style.display = 'block';
  $('stam').style.display = 'block'; $('guide').style.display = 'flex'; $('guide').className = '';
  msg('にげて! ひじょうぐちへ!', 2.6, true);
  playerCellKey = '';
}
function updateChase(dt) {
  chaseT += dt;
  // 赤い非常灯のゆらぎ
  ROOM_LIGHTS.forEach((l, i) => l.intensity = l.userData.dark * (0.75 + 0.25 * Math.sin(time * 3 + i)) * (Math.random() < 0.02 ? 0.1 : 1));
  const [pcx, pcz] = cellOf(player), key = pcx + ',' + pcz;
  if (key !== playerCellKey) { playerCellKey = key; playerField = bfs([freeCellOf(player)]); }
  let nearest = 99;
  for (let i = 0; i < chars.length; i++) {
    const e = chars[i];
    if (!e.active) { if (chaseT >= e.activateAt) e.active = true; else { e.root.rotation.y = lerpAngle(e.root.rotation.y, Math.atan2(player.x - e.pos.x, player.z - e.pos.z) + e.forward, dt * 4); continue; } }
    const dx = player.x - e.pos.x, dz = player.z - e.pos.z, d = Math.hypot(dx, dz);
    nearest = Math.min(nearest, d);
    let tx, tz;
    if (d < 12 && losWide(e.pos, player)) { tx = player.x; tz = player.z; }
    else { const [ex, ez] = cellOf(e.pos), n = nextStep(playerField, ex, ez); if (n) { tx = cw(n[0]); tz = cw(n[1]); } else { tx = player.x; tz = player.z; } }
    const sp = e.speed + Math.min(0.3, chaseT * 0.005);
    const mx = tx - e.pos.x, mz = tz - e.pos.z, ml = Math.hypot(mx, mz) || 1;
    e.pos.x += mx / ml * sp * dt; e.pos.z += mz / ml * sp * dt;
    for (const o of chars) { if (o === e) continue; const ox = e.pos.x - o.pos.x, oz = e.pos.z - o.pos.z, od = Math.hypot(ox, oz); if (od < 1 && od > 1e-4) { e.pos.x += ox / od * (1 - od) * 0.5; e.pos.z += oz / od * (1 - od) * 0.5; } }
    collide(e.pos, 0.42);
    e.moving = true;
    e.root.rotation.y = lerpAngle(e.root.rotation.y, Math.atan2(mx, mz) + e.forward, dt * 8);
    if (d < 0.95 && chaseT > invulnUntil) { if (lives > 0) hurt(e); else return caught(e); }
  }
  // 心音とビネット
  const danger = clamp(1 - (nearest - 2) / 12, 0, 1);
  $('vig').style.opacity = danger * (0.6 + 0.4 * Math.sin(time * 8));
  heartT -= dt; if (heartT <= 0 && danger > 0) { sfx.heart(0.4 + danger * 0.6); heartT = 1.2 - danger * 0.75; }
  whisperT -= dt; if (whisperT <= 0) { sfx.whisper(); whisperT = rand(6, 12); }
  for (const c of chars) { if (!c.active) continue; c.callT = (c.callT ?? rand(2, 5)) - dt; if (c.callT <= 0) { c.callT = rand(3.5, 7); voiceAt(c, true, 22); } }
  musicDanger = danger;
  // 案内
  const a = guideDir(exitField);
  $('arrIcon').style.transform = `rotate(${a ?? 0}rad)`;
  const dEx = exitField[gi(...freeCellOf(player))];
  $('guideTxt').textContent = `ひじょうぐち まで ${Math.max(0, dEx * CELL)}m`;
  if (chosenExit.cells.some(([x, z]) => x === pcx && z === pcz)) win();
}
function drawLives() {
  $('lives').innerHTML = 'たいりょく ' + Array.from({ length: MAX_LIVES }, (_, i) => `<b class="${i < lives ? '' : 'lost'}">❤</b>`).join('');
}
function hurt(e) {
  lives--; timesCaught++; drawLives();
  invulnUntil = chaseT + 2.5; shakeT = 0.5; stamina = 100; tired = false;
  sfx.hurt(); voiceAt(e, true, 10);
  const h = $('hurt'); h.classList.remove('on'); void h.offsetWidth; h.classList.add('on');
  msg(lives > 0 ? `いたっ! あと ${lives}かい までなら だいじょうぶ` : 'つぎ つかまったら アウト!', 2.2, true);
  // つかまえた子は遠くへワープして、少しのあいだ止まる
  const pf = bfs([freeCellOf(player)]); let pick = null;
  for (let k = 0; k < 200 && !pick; k++) { const x = (Math.random() * GW) | 0, z = (Math.random() * GH) | 0; if (pf[gi(x, z)] >= 14) pick = [x, z]; }
  if (pick) e.root.position.set(cw(pick[0]), 0, cw(pick[1]));
  e.active = false; e.activateAt = chaseT + 2.5; e.moving = false;
  burst(new V3(player.x, 1.2, player.z), [0xff3040, 0xff8090, 0x400010], 40);
}
function caught(e) {
  timesCaught++;
  state = 'caught'; caughtT = 0; caughtBy = e; sfx.caught();
  stopPad(drone); drone = null; stopMusic();
  if (document.pointerLockElement) document.exitPointerLock();
}
function updateCaught(dt) {
  caughtT += dt;
  const e = caughtBy, dx = e.pos.x - player.x, dz = e.pos.z - player.z;
  yaw = lerpAngle(yaw, Math.atan2(-dx, -dz), Math.min(1, dt * 10));
  pitch += (Math.atan2(1.0 - EYE_H, Math.hypot(dx, dz)) - pitch) * Math.min(1, dt * 10);
  camera.rotation.set(pitch, yaw, (Math.random() - 0.5) * 0.06);
  e.root.scale.setScalar(1.35 + Math.min(caughtT, 0.6) * 0.8);
  $('vig').style.opacity = 1;
  if (caughtT > 1.1 && !$('over').classList.contains('show')) {
    $('overTxt').textContent = `${e.def.name}に つかまった…`; $('over').classList.add('show');
  }
}
$('retryBtn').onclick = () => {
  $('over').classList.remove('show'); $('vig').style.opacity = 0;
  player.copy(checkpoint.pos); yaw = checkpoint.yaw; pitch = 0;
  chars.forEach(c => c.root.scale.setScalar(1.35));
  placeEnemies();
  drone = pad([55, 55.6, 82.4, 110.3], 'sawtooth', 0.06, 220); setMusic('scary');
  startChase(); lock();
};
function win() {
  state = 'win'; stopPad(drone); drone = null; stopMusic(); sfx.win(); setTimeout(() => setMusic('happy'), 2000);
  $('fade').style.opacity = 1; $('stam').style.display = 'none'; $('guide').style.display = 'none';
  if (document.pointerLockElement) document.exitPointerLock();
  const s = Math.round(time);
  $('winTxt').textContent = `⏱ ${Math.floor(s / 60)}ふん ${s % 60}びょう　😱 つかまった かいすう ${timesCaught}かい`;
  setTimeout(() => {
    // みんな元の姿に
    chars.forEach(c => { c.setDark(false); c.hud.classList.remove('dark'); });
    outlineMats.forEach(m => m.color.set(INK));
    $('hud').style.display = 'none';
    $('win').classList.add('show'); $('fade').style.opacity = 0; confetti();
    chars.forEach((c, i) => setTimeout(() => voice(c.def.key, { vol: 0.9, pan: (i / 5) * 1.6 - 0.8 }), 900 + i * 450));
  }, 1300);
}
$('againBtn').onclick = () => location.reload();
chars.forEach(c => { const d = document.createElement('div'); d.innerHTML = `<img src="${portraits[c.def.key]}">${c.def.name}`; $('wpals').appendChild(d); });
function confetti() {
  const cv = $('confetti'), x = cv.getContext('2d'); const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ['#f2849a', '#f5b44e', '#f7d65c', '#8fd673', '#7fc4f0', '#b59cf0', '#ffffff'];
  const ps = Array.from({ length: 160 }, () => ({ x: Math.random() * W, y: -Math.random() * H, vy: rand(1.5, 4), vx: rand(-1, 1), r: rand(0, 6), vr: rand(-0.15, 0.15), w: rand(6, 12), c: cols[(Math.random() * cols.length) | 0], star: Math.random() < 0.2 }));
  (function loop() {
    if (!$('win').classList.contains('show')) return;
    x.clearRect(0, 0, W, H);
    for (const p of ps) {
      p.y += p.vy; p.x += p.vx + Math.sin(p.y * 0.02); p.r += p.vr;
      if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c;
      if (p.star) { x.font = `${p.w * 2}px sans-serif`; x.fillText('⭐', -p.w, p.w); } else x.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2);
      x.restore();
    }
    requestAnimationFrame(loop);
  })();
}

// ---------- 世界のアニメーション ----------
function updateWorld(dt, t) {
  updateFish(t);
  weeds.forEach(w => w.rotation.z = Math.sin(t * 1.2 + w.userData.p) * 0.18);
  jellies.forEach(j => {
    const u = j.userData, a = t * 0.2 + u.p;
    j.position.set(u.cx + Math.cos(a) * u.r, u.y + Math.sin(t * 0.6 + u.p) * 0.6, u.cz + Math.sin(a) * u.r);
    const s = 1 + Math.sin(t * 2.5 + u.p) * 0.12; u.bell.scale.set(s, 2 - s, s);
  });
  anglers.forEach(g => {
    const u = g.userData, x = (u.x0 + u.x1) / 2 + Math.sin(t * u.w + u.p) * (u.x1 - u.x0) / 2;
    g.position.set(x, u.y + Math.sin(t + u.p) * 0.2, u.z); g.rotation.y = Math.cos(t * u.w + u.p) > 0 ? 0 : Math.PI;
  });
  bubbles.forEach(b => { const a = b.geometry.attributes.position; for (let i = 1; i < a.array.length; i += 3) { a.array[i] += dt * 0.9; if (a.array[i] > b.userData.top) a.array[i] = 0.3; } a.needsUpdate = true; });
  causticTex.offset.set(t * 0.012, t * 0.008);
  EXITS.forEach(e => {
    if (e.opening !== undefined && e.opening < 1) { e.opening = Math.min(1, e.opening + dt * 0.8); e.panels.forEach(p => p.position.x = p.userData.s * (0.98 + e.opening * 1.9)); }
    if (e.closing !== undefined && e.closing < 1) { e.closing = Math.min(1, e.closing + dt * 0.7); e.shutter.position.y = 1.7 + 4 * (1 - e.closing); }
  });
}

// ---------- タイトル画面のカメラ ----------
chars.forEach(c => c.root.visible = false);
function titleCam(t) {
  const a = t * 0.12; camera.position.set(44 + Math.cos(a) * 12, 2.4, 35 + Math.sin(a) * 7.5);
  camera.lookAt(44, 2, 35);
}

// ---------- メインループ ----------
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  let dt = Math.min(clock.getDelta(), 0.05);
  if (paused) dt = 0;
  time += dt;
  updateWorld(dt, time);
  if (state === 'title') titleCam(time);
  if (inPlay()) updatePlayer(dt);
  if (state === 'explore') updateExplore(dt);
  if (state === 'blackout') updateBlackout(dt);
  if (state === 'chase') updateChase(dt);
  if (state === 'caught') updateCaught(dt);
  chars.forEach(c => c.anim(dt, time, state === 'explore' ? player : null));
  updateSparks(dt);
  musicTick(state === 'chase' ? musicDanger : 0);
  renderer.render(scene, camera);
}
$('loading').remove();
tick();

// デバッグ用
window.__game = {
  get state() { return state; }, get exit() { return chosenExit && chosenExit.id; }, get yaw() { return yaw; }, get time() { return time; }, player, chars, grid, bfs,
  setView(x, z, y = 0, p = 0) { player.set(x, 0, z); yaw = y; pitch = p; },
  findAll() { chars.forEach(c => { if (!c.found) found(c); }); },
};
</script>
